name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Publish or open Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write  # required for npm Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is needed so changesets can diff against the base tag
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM token: publishing authenticates via npm Trusted Publishing
          # (OIDC), using the id-token: write permission granted above. Each
          # package must have a Trusted Publisher configured on npmjs.com
          # pointing at this repo + this workflow file before this works.
          #
          # provenance is set here (not in a committed .npmrc) so it only
          # applies in CI — a local `pnpm publish` has no OIDC token and
          # would fail if provenance were forced on outside this workflow.
          NPM_CONFIG_PROVENANCE: "true"
